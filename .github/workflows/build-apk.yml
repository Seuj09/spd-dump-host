name: Build APK

on:
  push:
    branches: [ main, feature/android-usb-fd-host ]
  pull_request:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform, build-tools, NDK, CMake
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          yes | sdkmanager --licenses || true

      - name: Build TomKing spd_dump for Android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config
          ./scripts/build-spd_dump-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK + native binaries
        uses: actions/upload-artifact@v4
        with:
          name: spd-dump-host-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/src/main/assets/bin/**/spd_dump
